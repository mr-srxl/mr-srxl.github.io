<section class="doc" aria-labelledby="gallery-title">
  <header class="doc-head" style="text-align:left;border-bottom:none;padding-bottom:6px;">
    <h1 id="gallery-title">Gallery</h1>
    <p class="doc-sub">Click any picture to see it full size.</p>
  </header>

  <div class="gallery">
    <figure class="shot" data-full="pic/1.webp" data-caption="Picture 1" role="img" aria-label="Picture 1" tabindex="0">
      <img src="pic/1.webp" alt="Picture 1" loading="lazy" decoding="async">
      <span class="zoom-hint"><i class="fas fa-expand"></i></span><figcaption>Picture 1</figcaption>
    </figure>
    <figure class="shot" data-full="pic/4.webp" data-caption="Picture 4" role="img" aria-label="Picture 4" tabindex="0">
      <img src="pic/4.webp" alt="Picture 4" loading="lazy" decoding="async">
      <span class="zoom-hint"><i class="fas fa-expand"></i></span><figcaption>Picture 4</figcaption>
    </figure>
    <figure class="shot" data-full="pic/5.webp" data-caption="Picture 5" role="img" aria-label="Picture 5" tabindex="0">
      <img src="pic/5.webp" alt="Picture 5" loading="lazy" decoding="async">
      <span class="zoom-hint"><i class="fas fa-expand"></i></span><figcaption>Picture 5</figcaption>
    </figure>
  </div>
</section>
