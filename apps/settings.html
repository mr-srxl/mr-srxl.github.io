<section class="doc settings-doc" aria-labelledby="settings-title">
  <header class="doc-head" style="text-align:left;border-bottom:none;padding-bottom:6px;">
    <h1 id="settings-title">Settings</h1>
    <p class="doc-sub">Make SRXL OS feel like home.</p>
  </header>

  <div class="settings-section">
    <h2>Theme</h2>
    <div class="settings-control" data-setting="theme" role="radiogroup" aria-label="Theme">
      <button data-value="auto" role="radio"><i class="fas fa-circle-half-stroke"></i> Auto</button>
      <button data-value="dark" role="radio"><i class="fas fa-moon"></i> Dark</button>
      <button data-value="light" role="radio"><i class="fas fa-sun"></i> Light</button>
    </div>
  </div>

  <div class="settings-section">
    <h2>Accent color</h2>
    <div class="theme-swatches" data-setting="accent" role="radiogroup" aria-label="Accent color">
      <button class="theme-swatch" data-value="default"  aria-label="Twilight blue"  role="radio"></button>
      <button class="theme-swatch" data-value="meadow"   aria-label="Meadow green"   role="radio"></button>
      <button class="theme-swatch" data-value="honey"    aria-label="Honey gold"     role="radio"></button>
      <button class="theme-swatch" data-value="lavender" aria-label="Lavender"       role="radio"></button>
      <button class="theme-swatch" data-value="rose"     aria-label="Rose"           role="radio"></button>
    </div>
  </div>

  <div class="settings-section">
    <h2>Motion</h2>
    <div class="settings-control" data-setting="motion" role="radiogroup" aria-label="Motion">
      <button data-value="full"    role="radio">Full</button>
      <button data-value="reduced" role="radio">Reduced</button>
    </div>
  </div>

  <div class="settings-section">
    <h2>Wallpaper</h2>
    <div class="settings-control" data-setting="wallpaper" role="radiogroup" aria-label="Wallpaper">
      <button data-value="auto"  role="radio">Auto</button>
      <button data-value="win"   role="radio">Meadow</button>
      <button data-value="linux" role="radio">Night</button>
      <button data-value="none"  role="radio">Minimal</button>
    </div>
  </div>

  <div class="settings-section">
    <h2>Terminal font size</h2>
    <div class="settings-control" data-setting="termSize" role="radiogroup" aria-label="Terminal font size">
      <button data-value="small"  role="radio">Small</button>
      <button data-value="medium" role="radio">Medium</button>
      <button data-value="large"  role="radio">Large</button>
    </div>
  </div>

  <p class="settings-note">Settings are saved to your browser and applied on next visit.</p>
</section>
