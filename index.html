<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0e14">
<title>Sina Rezaei (SRXL) — Red Team Operator &amp; Malware Developer</title>
<meta name="description" content="The quiet portfolio of Sina Rezaei (SRXL) — red team operator and malware developer.">
<link rel="canonical" href="https://srxl.dev/">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">


<!-- styles. -->
<link rel="stylesheet" href="styles/01-tokens.css">
<link rel="stylesheet" href="styles/02-boot.css">
<link rel="stylesheet" href="styles/03-desktop.css">
<link rel="stylesheet" href="styles/04-windows.css">
<link rel="stylesheet" href="styles/05-doc.css">
<link rel="stylesheet" href="styles/06-code.css">
<link rel="stylesheet" href="styles/07-blog.css">
<link rel="stylesheet" href="styles/08-gallery.css">
<link rel="stylesheet" href="styles/09-terminal.css">
<link rel="stylesheet" href="styles/10-taskbar.css">
<link rel="stylesheet" href="styles/11-syntax.css">
<link rel="stylesheet" href="styles/12-responsive.css">
<link rel="stylesheet" href="styles/99-custom.css">

<!-- Markdown parser for the Notes section -->
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<!-- Syntax highlighting for Python (and bash, html, etc.) -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
</head>
<body>

<!-- Boot -->
<div id="boot-screen" class="screen">
  <div class="boot-inner">
    <p class="boot-eyebrow">SRXL OS</p>
    <p class="boot-title">Choose your view</p>
    <p class="boot-sub">A quiet corner of the internet.</p>
    <div class="os-selection">
      <button class="os-card" data-os="windows" aria-label="Enter Windows desktop">
        <i class="fab fa-windows" aria-hidden="true"></i><span>Windows</span>
      </button>
      <button class="os-card" data-os="linux" aria-label="Enter Linux desktop">
        <i class="fab fa-linux" aria-hidden="true"></i><span>Linux</span>
      </button>
    </div>
  </div>
</div>

<!-- Loading -->
<div id="loading-screen" class="screen">
  <div class="win-loader" id="win-loader" aria-hidden="true">
    <div class="orb-loader">
      <div class="orb-core"></div>
      <div class="orb-ring ring-1"></div>
      <div class="orb-ring ring-2"></div>
      <div class="orb-ring ring-3"></div>
      <div class="loader-particles"><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span></div>
    </div>
    <div class="loader-caption">
      <div class="cap-title">Loading</div>
      <div class="cap-sub">A quiet moment in the meadow…</div>
    </div>
  </div>
  <div class="linux-loader" id="linux-loader" aria-hidden="true"></div>
</div>

<!-- Desktop -->
<div id="desktop" role="application" aria-label="SRXL desktop">
  <nav id="desktop-icons" aria-label="Desktop shortcuts">
    <button class="desk-icon" data-open="about"><i class="fas fa-user-secret ic-about"></i><span>About</span></button>
    <button class="desk-icon" data-open="learning"><i class="fas fa-folder-open ic-learn"></i><span>Path</span></button>
    <button class="desk-icon" data-open="skills"><i class="fas fa-code ic-skills"></i><span>Skills</span></button>
    <button class="desk-icon" data-open="python"><i class="fab fa-python ic-python"></i><span>Python</span></button>
    <button class="desk-icon" data-open="blog"><i class="fas fa-feather ic-notes"></i><span>Notes</span></button>
    <button class="desk-icon" data-open="gallery"><i class="fas fa-images ic-gallery"></i><span>Gallery</span></button>
    <button class="desk-icon" data-open="terminal"><i class="fas fa-terminal ic-term"></i><span>Terminal</span></button>
  </nav>

  <div id="windows-container"></div>

  <div id="taskbar">
    <div class="taskbar-left"><span class="activities">Activities</span></div>
    <div class="taskbar-center">
      <button class="start-btn" aria-label="Start"><i class="fab fa-windows"></i></button>
      <div id="taskbar-items" style="display:flex;gap:6px;align-items:center;"></div>
    </div>
    <div class="taskbar-right">
      <i class="fas fa-wifi"></i><i class="fas fa-volume-high"></i><i class="fas fa-battery-full"></i>
      <span id="clock">--:--</span>
    </div>
  </div>
</div>

<!-- Lightbox -->
<div id="lightbox" role="dialog" aria-modal="true" aria-label="Image viewer" hidden>
  <button class="lb-close" aria-label="Close"><i class="fas fa-xmark"></i></button>
  <button class="lb-nav lb-prev" aria-label="Previous"><i class="fas fa-chevron-left"></i></button>
  <button class="lb-nav lb-next" aria-label="Next"><i class="fas fa-chevron-right"></i></button>
  <div class="lb-stage">
    <span class="lb-counter" id="lb-counter">1 / 6</span>
    <img class="lb-image" id="lb-image" src="" alt="">
    <div class="lb-caption" id="lb-caption"></div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
