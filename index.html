<!-- Apply saved settings before any CSS loads (prevents theme flash) -->
<script>
(function () {
  try {
    var s = JSON.parse(localStorage.getItem("srxl-settings") || "{}");
    var h = document.documentElement;
    if (s.accent && s.accent !== "default")   h.dataset.accent    = s.accent;
    if (s.motion === "reduced")               h.dataset.motion    = "reduced";
    if (s.wallpaper && s.wallpaper !== "auto") h.dataset.wallpaper = s.wallpaper;
    if (s.termSize && s.termSize !== "medium") h.dataset.termSize  = s.termSize;
    var themeVal = s.theme || "auto";
    var resolvedTheme = (themeVal === "light" || themeVal === "dark")
      ? themeVal
      : (window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
    if (resolvedTheme === "light") h.dataset.theme = "light";
  } catch (e) { /* ignore */ }
})();
</script>
